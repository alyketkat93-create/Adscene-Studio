<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="serumBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="dropperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="35" stdDeviation="40" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#serumBg)"/>
  <ellipse cx="512" cy="860" rx="260" ry="35" fill="#000" opacity="0.9" filter="blur(25px)"/>

  <g filter="url(#dropperShadow)">
    <!-- Frosted Emerald Glass Bottle -->
    <rect x="362" y="420" width="300" height="420" rx="36" fill="url(#emeraldGlass)" stroke="#34d399" stroke-width="2"/>
    <rect x="382" y="440" width="260" height="380" rx="26" fill="#047857" opacity="0.8"/>
    
    <!-- White Minimal Label -->
    <rect x="402" y="520" width="220" height="200" rx="10" fill="#ffffff" opacity="0.95"/>
    <text x="512" y="565" text-anchor="middle" fill="#064e3b" font-family="'Cairo', sans-serif" font-size="16" font-weight="900" letter-spacing="3">LUMIÈRE</text>
    <text x="512" y="595" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="2">BOTANICAL GLOW</text>
    <line x1="442" y1="615" x2="582" y2="615" stroke="#10b981" stroke-width="1.5"/>
    <text x="512" y="645" text-anchor="middle" fill="#374151" font-family="system-ui, sans-serif" font-size="11">VITAMIN C + NIACINAMIDE</text>
    <text x="512" y="680" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">30 ML / 1.0 FL.OZ</text>

    <!-- Dropper Collar -->
    <rect x="442" y="360" width="140" height="60" rx="8" fill="url(#roseGold)" stroke="#ffedd5" stroke-width="1.5"/>
    
    <!-- Rubber Dropper Bulb -->
    <path d="M 462 360 C 462 250, 562 250, 562 360 Z" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  </g>
</svg>
