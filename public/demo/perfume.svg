<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="perfumeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1f23"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#ca8a04"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="25%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="75%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="amberJuice" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="40" stdDeviation="45" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#perfumeBg)"/>
  
  <!-- Studio Contact Shadow -->
  <ellipse cx="512" cy="850" rx="280" ry="40" fill="#000000" opacity="0.9" filter="blur(30px)"/>
  
  <!-- Bottle Group -->
  <g filter="url(#softShadow)">
    <!-- Main Flacon Base (Heavy Smoked Glass) -->
    <rect x="332" y="380" width="360" height="440" rx="24" fill="url(#glassBody)" stroke="#52525b" stroke-width="2"/>
    
    <!-- Internal Liquid Cavity with Amber Radiance -->
    <rect x="362" y="420" width="300" height="370" rx="16" fill="url(#amberJuice)"/>
    
    <!-- Flacon Bevel Highlight Reflections -->
    <line x1="340" y1="390" x2="340" y2="810" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4"/>
    <line x1="684" y1="390" x2="684" y2="810" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
    
    <!-- Front Plaque / Label -->
    <rect x="392" y="520" width="240" height="160" rx="8" fill="#09090b" stroke="url(#goldCap)" stroke-width="3"/>
    <text x="512" y="565" text-anchor="middle" fill="#fef08a" font-family="'Cinzel', 'Trajan Pro', Georgia, serif" font-size="20" font-weight="bold" letter-spacing="4">OUD ROYALE</text>
    <line x1="432" y1="585" x2="592" y2="585" stroke="url(#goldCap)" stroke-width="1.5"/>
    <text x="512" y="615" text-anchor="middle" fill="#d4d4d8" font-family="'Cairo', sans-serif" font-size="13" letter-spacing="3">EXTRAIT DE PARFUM</text>
    <text x="512" y="645" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2">100 ML • 3.4 FL.OZ</text>

    <!-- Spray Collar -->
    <rect x="462" y="330" width="100" height="50" rx="6" fill="url(#goldCap)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
    
    <!-- Heavy Cylindrical Zamac Cap -->
    <rect x="422" y="180" width="180" height="150" rx="12" fill="url(#goldCap)" stroke="#fef08a" stroke-width="2"/>
    <rect x="432" y="190" width="160" height="130" rx="8" fill="url(#goldCap)"/>
    
    <!-- Crown knurling grooves on cap -->
    <line x1="452" y1="190" x2="452" y2="320" stroke="#713f12" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="482" y1="190" x2="482" y2="320" stroke="#fef08a" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="512" y1="190" x2="512" y2="320" stroke="#713f12" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="542" y1="190" x2="542" y2="320" stroke="#fef08a" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="572" y1="190" x2="572" y2="320" stroke="#713f12" stroke-opacity="0.4" stroke-width="2"/>
  </g>
</svg>
