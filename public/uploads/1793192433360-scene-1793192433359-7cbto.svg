<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
      <defs>
        <radialGradient id="halo" cx="50%" cy="45%" r="40%">
          <stop offset="0%" stop-color="#eab308" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="podiumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3f3f46"/>
          <stop offset="100%" stop-color="#18181b"/>
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000" flood-opacity="0.8"/>
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
        </pattern>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#090a0f"/>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      <rect width="100%" height="100%" style="fill: radial-gradient(circle at 50% 40%, #27272a 0%, #09090b 80%, #000000 100%); opacity: 0.85;"/>
      <circle cx="360" cy="576" r="324" fill="url(#halo)"/>

      <!-- Atmospheric light beams -->
      <path d="M 144 0 L 324 896 L 396.00000000000006 896 L 576 0 Z" fill="white" opacity="0.03"/>

      <!-- Ground / Pedestal -->
      <ellipse cx="360" cy="921.5999999999999" rx="230.4" ry="102.4" fill="url(#podiumGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" filter="url(#shadow)"/>
      <ellipse cx="360" cy="921.5999999999999" rx="230.4" ry="102.4" fill="none" stroke="#eab308" stroke-opacity="0.3" stroke-width="1"/>
      <ellipse cx="360" cy="960" rx="251.99999999999997" ry="115.19999999999999" fill="black" opacity="0.6" filter="blur(20px)"/>

      <!-- Product Silhouette / Showcase Centerpiece -->
      <g transform="translate(240, 346.4)" filter="url(#shadow)">
        <!-- Bottle / Product Base -->
        <rect x="30" y="80" width="180" height="230" rx="16" fill="#18181b" stroke="#eab308" stroke-width="2"/>
        <rect x="40" y="90" width="160" height="210" rx="10" fill="#27272a" opacity="0.9"/>
        <!-- Inner Amber Glow / Liquid -->
        <rect x="45" y="120" width="150" height="170" rx="8" fill="url(#halo)" opacity="0.8"/>
        <!-- Metallic Cap -->
        <rect x="75" y="15" width="90" height="70" rx="6" fill="#eab308" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
        <line x1="85" y1="20" x2="85" y2="80" stroke="#000" stroke-opacity="0.2" stroke-width="2"/>
        <line x1="120" y1="20" x2="120" y2="80" stroke="#fff" stroke-opacity="0.3" stroke-width="2"/>
        <line x1="155" y1="20" x2="155" y2="80" stroke="#000" stroke-opacity="0.2" stroke-width="2"/>
        <rect x="100" y="5" width="40" height="12" rx="2" fill="#eab308"/>
        <!-- Label Plaque -->
        <rect x="65" y="160" width="110" height="75" rx="4" fill="#09090b" stroke="#eab308" stroke-width="1"/>
        <text x="120" y="185" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" letter-spacing="2">ADSCENE</text>
        <line x1="85" y1="195" x2="155" y2="195" stroke="#eab308" stroke-width="1"/>
        <text x="120" y="210" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1">ORIGINAL PRODUCT</text>
        <text x="120" y="224" text-anchor="middle" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="7" letter-spacing="1">VERIFIED FIDELITY</text>
      </g>

      <!-- Glass reflections / Highlights -->
      <path d="M 290 524.8 L 320 524.8 L 280 832 L 265 832 Z" fill="white" opacity="0.15"/>

      <!-- Overlay Badges & Studio Watermark -->
      <rect x="24" y="24" width="auto" height="32" rx="6" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="36" y="45" fill="#eab308" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ADSCENE STUDIO • LUXURY DARK & GOLD</text>
      <text x="696" y="45" text-anchor="end" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="11">ASPECT: 9:16 | 8K COMMERCIAL</text>

      <!-- Bottom cinematic bar -->
      <rect x="0" y="1232" width="720" height="48" fill="rgba(0,0,0,0.7)"/>
      <circle cx="36" cy="1256" r="5" fill="#22c55e"/>
      <text x="50" y="1260" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Product Identity 100% Locked</text>
      <text x="696" y="1260" text-anchor="end" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="11">Ready for Image-to-Video (Veo / Runway / Kling / Luma)</text>
    </svg>